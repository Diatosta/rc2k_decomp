<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Championship</title>
<!-- Cross-origin isolation where the host sends no headers (GitHub Pages): registers a service worker that adds them, then reloads once. -->
<script src="coi-serviceworker.js"></script>
<style>
  :root { --bg: #0b0d10; --panel: #161a20; --text: #d8dde4; --dim: #8a94a3; --accent: #e0a526; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  /* !important: SDL sets its own pixel size on the canvas when the window's size changes. */
  canvas { display: none; width: 100vw !important; height: 100vh !important; object-fit: contain; background: #000; }
  body.playing canvas { display: block; }
  /* The GL's canvas lies over the game's own, empty (clear) until the GL runs; the mouse reaches
     the one below. */
  #glcanvas { position: fixed; inset: 0; background: transparent; pointer-events: none; }
  body.playing #panel { display: none; }
  #panel { max-width: 34rem; margin: 0 auto; padding: 2rem 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  p { color: var(--dim); margin: .4rem 0 1rem; }
  .box { background: var(--panel); border-radius: 10px; padding: 1rem; margin: 1rem 0; }
  label { display: block; font-weight: 600; margin-bottom: .5rem; }
  button { margin-top: .6rem; padding: .6rem 1rem; border: 0; border-radius: 6px;
    background: var(--accent); color: #111; font-weight: 700; font-size: 1rem; }
  progress { width: 100%; height: 10px; }
  #status { min-height: 1.4em; }
  .error { color: #ff7a6b; }
  a { color: var(--accent); }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
<canvas id="glcanvas"></canvas>
<div id="panel">
  <h1>Rally Championship</h1>
  <p id="lead">Starting…</p>
  <div id="import" hidden>
    <div class="box">
      <label for="zips">The game folder's zip (one or several parts)</label>
      <input id="zips" type="file" accept=".zip,application/zip" multiple>
    </div>
    <div class="box">
      <label for="folder">Or the game folder itself</label>
      <input id="folder" type="file" webkitdirectory multiple>
    </div>
  </div>
  <div id="working" hidden><progress id="bar" max="1" value="0"></progress></div>
  <p id="status"></p>
  <button id="again" hidden>Start again</button>
  <p><a href="saves.html" id="saves">Export or import the saves and settings</a></p>
</div>
<script>
// The folders in the origin's storage (`src/platform/web.rs`): the unpacked zip, and the home folder
// the installer puts the game in.
const SOURCE = ["source"];
const INSTALLED = ["home", ".local", "share", "rally-championship"];
const $ = (id) => document.getElementById(id);

async function has(parts, file) {
  try {
    let d = await navigator.storage.getDirectory();
    for (const p of parts) d = await d.getDirectoryHandle(p);
    await d.getFileHandle(file);
    return true;
  } catch { return false; }
}

// Names in the storage keep the zip's case: the game finds them in any case, the page looks
// for both of the CD's spellings.
async function hasSource() {
  return (await has(SOURCE, "RAL.EXE")) || (await has(SOURCE, "ral.exe"));
}

// An installed game in the installer's target: its record, or the settings file of a game
// installed by the original (the importer puts an installed folder there, to be played with no
// installer).
async function hasInstalledGame() {
  const var_ = INSTALLED.concat(["var"]);
  return (await has(var_, "install.cfg")) || (await has(var_, "ral.zog"));
}

// The display's refreshes a second, measured from the page's own animation frames (the browser
// does not say): the median of the last frames' gaps, kept in `window.rc2kRefresh` for the game
// (`library.js`). Gaps over 100 ms (a hidden tab, a stall) are left out.
(() => {
  const gaps = [];
  let last = 0;
  const tick = (now) => {
    if (last && now - last < 100) {
      gaps.push(now - last);
      if (gaps.length > 90) gaps.shift();
      if (gaps.length >= 20) {
        const sorted = [...gaps].sort((a, b) => a - b);
        const rate = 1000 / sorted[sorted.length >> 1];
        // Whole numbers and the usual 59.94 / 119.88 / 143.86 near a measured value.
        const whole = Math.round(rate);
        window.rc2kRefresh = Math.abs(rate - whole) < 0.6 ? whole : rate;
      }
    }
    last = now;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

function status(text, error) {
  $("status").textContent = text;
  $("status").className = error ? "error" : "";
}

// The trial switches in the address (`?env=`, `?args=`) are honoured on a developer's own machine
// (localhost) and on a hosted page whose browser has `localStorage.rc2kDev = "1"` (typed in its
// console: a link cannot set it), so a link cannot start a visitor's game with them.
const DEV_SWITCHES = (() => {
  if (["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) return true;
  try {
    return localStorage.getItem("rc2kDev") === "1";
  } catch {
    return false;
  }
})();

function start(dir, installer) {
  document.body.classList.add("playing");
  window.Module = {
    canvas: $("canvas"),
    preRun: [() => {
      Module.ENV.HOME = "/opfs/home";
      Module.ENV.RC2K_DIR = dir;
      // Environment variables of the program (`?env=RC2K_LOAD_TIMES=1`, repeatable), for trials.
      for (const pair of DEV_SWITCHES ? new URLSearchParams(location.search).getAll("env") : []) {
        const at = pair.indexOf("=");
        if (at > 0) Module.ENV[pair.slice(0, at)] = pair.slice(at + 1);
      }
    }],
    // The game's switches (`rc2k --help`), as `?args=--stage%20Langton%20--mode%20time-trial`.
    arguments: (DEV_SWITCHES ? new URLSearchParams(location.search).get("args") || "" : "").split(/\s+/).filter(Boolean),
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    // The program ended (the installer when it is done, the game when left). The installer
    // that left an installed game starts it by reloading the page; else the page is shown again.
    onExit: async (code) => {
      if (installer && code === 0 && (await hasInstalledGame())) {
        location.reload();
        return;
      }
      document.body.classList.remove("playing");
      $("lead").textContent = "The game ended (" + code + ").";
      $("again").hidden = false;
    },
  };
  const s = document.createElement("script");
  s.src = "rc2k.js";
  document.body.appendChild(s);
}

function unpack(message) {
  $("import").hidden = true;
  $("working").hidden = false;
  status("Unpacking…");
  const worker = new Worker("unzip.js");
  worker.onmessage = async (m) => {
    if (m.data.progress !== undefined) {
      $("bar").value = m.data.progress;
      status(m.data.text);
    } else if (m.data.done !== undefined) {
      worker.terminate();
      if (m.data.installed ? await hasInstalledGame() : await hasSource()) {
        status(m.data.done + " files unpacked.");
        location.reload();
      } else {
        $("import").hidden = false;
        $("working").hidden = true;
        status("No RAL.EXE in what was unpacked: is it the game folder?", true);
      }
    } else if (m.data.error) {
      worker.terminate();
      $("import").hidden = false;
      $("working").hidden = true;
      status(m.data.error, true);
    }
  };
  worker.postMessage(message);
}

$("zips").onchange = (e) => e.target.files.length && unpack({ files: [...e.target.files] });
// A picked folder: each file's path below the picked folder (the browser names it from the
// folder's own name down), so RAL.EXE lands at the top of the storage's copy as from a zip.
$("folder").onchange = (e) => {
  const picked = [...e.target.files];
  if (!picked.length) return;
  unpack({
    folder: picked.map((file) => ({
      file,
      path: (file.webkitRelativePath || file.name).split("/").slice(1).join("/") || file.name,
    })),
  });
};
$("again").onclick = () => location.reload();

(async () => {
  if (!self.crossOriginIsolated) {
    $("lead").textContent = "This page needs cross-origin isolation: open it over https (or tools/web/serve.py) in a browser that allows service workers, not a private window.";
    return;
  }
  if (navigator.storage.persist) navigator.storage.persist();
  if (await hasInstalledGame()) {
    start("/opfs/" + INSTALLED.join("/"), false);
  } else if (await hasSource()) {
    $("lead").textContent = "Installing from the unpacked folder…";
    start("/opfs/" + SOURCE.join("/"), true);
  } else {
    $("lead").textContent = "First, the game's files: they are kept in this browser for the next time.";
    $("import").hidden = false;
  }
})();
</script>
</body>
</html>
