# The game's logic, platform-free (Linux and Windows tests): `rc2k_core/`.
[workspace]
members = ["rc2k_core"]

[package]
name = "rc2k_hook"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

# The program: the ported game on SDL, RAL.EXE's data built in (`src/standalone.rs`).
[[bin]]
name = "rc2k"
path = "src/bin/rc2k.rs"

[dependencies]
rc2k_core = { path = "rc2k_core" }
miniz_oxide = "0.8"
sdl3-sys = "0.7"
# The standalone's rasteriser: a big triangle's rows over the processor's threads.
rayon = "1.10"

# The system's own facts on Unix (`src/os/unix.rs`): free space, memory, the stack, `_exit`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows' own (`src/os/windows.rs`, the fault handler, the profiler, the shortcuts).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_System_Memory", "Win32_System_Kernel", "Win32_System_Com", "Win32_UI_Shell"] }
