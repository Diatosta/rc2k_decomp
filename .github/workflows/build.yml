# Builds the game (`rc2k`) for 64-bit Windows, for Linux and for macOS on every push and pull
# request, and keeps each build as a download of the run (Actions -> the run -> Artifacts).
# macOS is built on a Mac runner (`deploy_standalone.sh mac`); the others on Linux the way
# `deploy_standalone.sh` builds them: Windows with cargo-xwin
# (clang-cl and the Windows SDK it fetches), SDL's ready-made DLL (`tools/fetch_sdl3.sh`)
# and FFmpeg's decoders built from their signed source (`tools/build_ffmpeg.sh x64`);
# Linux with SDL built from source and FFmpeg's decoders linked in (`build_ffmpeg.sh
# linux`), so the program needs only the C library. `third_party/` is cached by the
# scripts' contents: FFmpeg is built again only when its script changes. Ubuntu 24.04, not
# `ubuntu-latest`: the Linux program needs the glibc it is built against or newer (2.38
# there; 26.04's 2.43 would leave out most systems in use).
#
# A push also publishes the three builds as a GitHub release (the `release` job): from `main`
# a stable one, tagged `stable-<date>-<commit>` and marked the latest; from any other branch
# an experimental pre-release, `experimental-<branch>`, replaced by each push to that branch.
# Pull requests only build.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          # Clang 19 at least: the Windows SDK's C++ library refuses older ones.
          sudo apt-get install -y build-essential clang-19 lld-19 llvm-19 make gpg unzip xz-utils
          # lld-link, llvm-lib and llvm-nm by those names: LLVM's own folder; clang-cl is
          # clang called by that name (Ubuntu's clang package has no clang-cl).
          LLVM=/usr/lib/llvm-19/bin
          mkdir -p "$HOME/.local/llvm-names"
          ln -sf "$LLVM/clang" "$HOME/.local/llvm-names/clang-cl"
          echo "$LLVM" >> "$GITHUB_PATH"
          echo "$HOME/.local/llvm-names" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: cargo-xwin
        run: cargo install --locked cargo-xwin

      - name: Cached third_party
        uses: actions/cache@v6
        with:
          path: |
            third_party
            ~/.cache/cargo-xwin
          key: windows-x64-${{ hashFiles('tools/fetch_sdl3.sh', 'tools/build_ffmpeg.sh') }}

      - name: SDL, the Windows SDK and FFmpeg
        run: |
          tools/fetch_sdl3.sh
          cargo xwin cache xwin --xwin-arch x86_64
          tools/build_ffmpeg.sh x64

      - name: Build
        run: cargo xwin build --release --xwin-arch x86_64 --target x86_64-pc-windows-msvc --bin rc2k

      - name: Pack
        run: |
          mkdir -p out
          cp target/x86_64-pc-windows-msvc/release/rc2k.exe third_party/sdl3/lib/x64/SDL3.dll \
            third_party/ffmpeg-x64/bin/avcodec-61.dll third_party/ffmpeg-x64/bin/avutil-59.dll out/

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-windows-x64-${{ github.sha }}
          path: out/

  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools and SDL's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config gpg xz-utils \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Cached FFmpeg
        uses: actions/cache@v6
        with:
          path: third_party/ffmpeg-linux
          key: linux-x64-${{ hashFiles('tools/build_ffmpeg.sh') }}

      - name: FFmpeg
        run: tools/build_ffmpeg.sh linux

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin rc2k

      - name: Pack
        run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-gnu/release/rc2k out/
          echo "needs glibc $(objdump -T out/rc2k | grep -v ' w ' | grep -oE 'GLIBC_[0-9.]+' \
            | sort -uV | tail -1 | cut -d_ -f2) or newer"

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-linux-x64-${{ github.sha }}
          path: out/

  macos:
    # Built on the Mac runner as on a Mac (`deploy_standalone.sh mac`): Intel and Apple
    # silicon joined into one program in `Rally Championship.app`, signed ad hoc. Only for
    # `main` and runs started by hand: a private repository's Mac minutes count ten times.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: brew install gnupg

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Cached FFmpeg
        uses: actions/cache@v6
        with:
          path: |
            third_party/ffmpeg-mac-x64
            third_party/ffmpeg-mac-a64
          key: macos-${{ hashFiles('tools/build_ffmpeg.sh') }}

      - name: Build
        run: MAC_GAME_DIR=out ./deploy_standalone.sh mac

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-macos-${{ github.sha }}
          path: out/

  release:
    needs: [windows-x64, linux-x64, macos]
    # The Mac job skipped (other branches) leaves the release to the other two.
    if: github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: builds

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          DAY="$(date -u +%Y-%m-%d)"
          cd builds
          # The artifacts lose the executable bit: the Linux and Mac programs get it back.
          chmod +x rc2k-linux-x64-*/rc2k rc2k-macos-*/*.app/Contents/MacOS/rc2k
          for d in */; do
            name="${d%/}"; name="${name%-$GITHUB_SHA}"
            (cd "$d" && zip -q -r "../$name.zip" .)
          done
          if [ "$BRANCH" = main ]; then
            TAG="stable-${DAY//-/}-$SHORT"
            TITLE="Stable $DAY ($SHORT)"
            NOTES="Built from main at $GITHUB_SHA."
            FLAGS=(--latest)
          else
            TAG="experimental-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
            TITLE="Experimental: $BRANCH ($SHORT)"
            NOTES="Experimental build of the $BRANCH branch at $GITHUB_SHA, replaced by its next push. Not checked like the stable builds: expect bugs."
            FLAGS=(--prerelease --latest=false)
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip --clobber
          else
            gh release create "$TAG" *.zip --target "$GITHUB_SHA" --title "$TITLE" \
              --notes "$NOTES" "${FLAGS[@]}"
          fi
