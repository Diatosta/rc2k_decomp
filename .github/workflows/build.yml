# Builds the game (`rc2k`) for 64-bit Windows, for Linux (also the Steam Deck and the Anbernic
# handheld), for macOS, for Android and iOS, and for the browser (`web`), on every push and pull request, and keeps each build as a download of the run (Actions -> the run -> Artifacts).
# Every job runs the repository's own entry point, `./build.sh <target>`, and uploads the
# dist/<target>/ folder it makes. macOS is built on a Mac runner; the others on Linux:
# Windows with cargo-xwin (clang-cl and the Windows SDK it fetches), SDL's ready-made DLL
# (`tools/fetch_sdl3.sh`); Linux with SDL built from source and linked in, so the program
# needs only the C library. The films are decoded in Rust: no media library is built.
# `third_party/` is cached by the SDL script's contents. Ubuntu 24.04, not
# `ubuntu-latest`: the Linux program needs the glibc it is built against or newer (2.38
# there; 26.04's 2.43 would leave out most systems in use).
#
# A push also publishes the builds as a GitHub release (the `release` job): from `main`
# a stable one, tagged `stable-<date>-<commit>` and marked the latest; from any other branch
# an experimental pre-release, `experimental-<branch>`, replaced by each push to that branch.
# Pull requests only build. The web build is also published on GitHub Pages (the `pages` job),
# once the repository's Pages and its PAGES_ENABLED variable are switched on (see that job).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only unless a job says more (the pages and release jobs do).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get update
          # Clang 19 at least: the Windows SDK's C++ library refuses older ones.
          sudo apt-get install -y build-essential clang-19 lld-19 llvm-19 unzip
          # lld-link, llvm-lib and llvm-nm by those names: LLVM's own folder; clang-cl is
          # clang called by that name (Ubuntu's clang package has no clang-cl).
          LLVM=/usr/lib/llvm-19/bin
          mkdir -p "$HOME/.local/llvm-names"
          ln -sf "$LLVM/clang" "$HOME/.local/llvm-names/clang-cl"
          echo "$LLVM" >> "$GITHUB_PATH"
          echo "$HOME/.local/llvm-names" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: cargo-xwin
        run: cargo install --locked cargo-xwin

      - name: Cached third_party
        uses: actions/cache@v6
        with:
          path: |
            third_party
            ~/.cache/cargo-xwin
          key: windows-x64-${{ hashFiles('tools/fetch_sdl3.sh') }}

      # SDL, the Windows SDK, the program, and dist/windows-x64/ with its DLLs.
      - name: Build
        run: ./build.sh windows-x64

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-windows-x64-${{ github.sha }}
          path: dist/windows-x64/

  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Tools and SDL's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      # The program, and dist/linux/; it prints the glibc the program needs.
      - name: Build
        run: ./build.sh linux

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-linux-x64-${{ github.sha }}
          path: dist/linux/

      # The program's symbols and line tables (`rc2k.debug`, beside the program for a named backtrace).
      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-linux-x64-debug-${{ github.sha }}
          path: dist/linux-debug/

  deck:
    # The Steam Deck's build (`./build.sh deck`): the same commands as on a developer's machine, in
    # a container of Ubuntu 22.04 (tools/deck/Dockerfile) whose glibc 2.35 every SteamOS 3 system
    # has; SDL is built inside it and the program is tuned for the Deck's Zen 2 processor. Like
    # the other jobs it ships without Valve's library (no Steamworks SDK on the runner); Steam play
    # needs `libsteam_api.so` put beside the program. Rust comes from the runner's own home,
    # mounted into the container.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The toolchain the repository pins, installed on the runner for the container to use.
      - name: Pinned Rust toolchain
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: deck

      # The container image, the program (dist/deck/ with rally.sh); it
      # prints the glibc the program needs.
      - name: Build
        run: ./build.sh deck

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-deck-${{ github.sha }}
          path: dist/deck/

      # The program's symbols and line tables (`rc2k.debug`, beside the program for a named backtrace).
      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-deck-debug-${{ github.sha }}
          path: dist/deck-debug/

  handheld:
    # The Anbernic RG34XXSP's build (`./build.sh handheld`): the same commands as on a developer's
    # machine, in a container of Ubuntu 22.04 (tools/anbernic/Dockerfile, glibc 2.35, the
    # device's own system) with the arm64 cross compiler. Rust comes from the runner's own home,
    # mounted into the container. The folder (dist/handheld/) holds the program, its launcher
    # `Rally.sh` and the menu picture.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The toolchain the repository pins, with the arm64 target, for the container to use.
      - name: Pinned Rust toolchain
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --component clippy --component rustfmt \
            --target aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: handheld
          # The container builds into target/a64-linux.
          workspaces: ". -> target/a64-linux"

      - name: Build
        run: ./build.sh handheld

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-handheld-${{ github.sha }}
          path: dist/handheld/

  web:
    # The browser build (`./build.sh web`): WebAssembly through Emscripten, its threads on the
    # browser's workers. It holds no game data: the player picks their own game folder or zip on
    # the page. The Emscripten SDK is cloned into ~/emsdk (where the build script looks) at the
    # version the build was made with, and cached. The folder is kept as a download of the run
    # and, when Pages is switched on (below), published by the `pages` job.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EMSDK_VERSION: "7.0.0"
      # The nightly the web build was made with (std is rebuilt with atomics).
      NIGHTLY: nightly-2026-10-25
    steps:
      - uses: actions/checkout@v7

      - name: Nightly Rust with the web target
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src \
            --target wasm32-unknown-emscripten
          # The build script's toolchain (`cargo +$RC2K_NIGHTLY`; rustup no longer lets a pinned
          # toolchain be linked under the name `nightly`).
          echo "RC2K_NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          workspaces: |
            . -> target/web
            . -> target/web_codes

      - name: Cached Emscripten SDK
        id: emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-ubuntu-24.04

      - name: Emscripten SDK
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      # The program and dist/web/ (the page, its worker, the cross-origin isolation helper).
      - name: Build
        run: ./build.sh web

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-web-${{ github.sha }}
          path: dist/web/

  pages:
    # Publishes the web build on this repository's GitHub Pages. Off until switched on: a private
    # repository (or one without Pages) cannot deploy, and a failing step would turn every run
    # red. To switch it on: Settings -> Pages -> Source: "GitHub Actions", then Settings ->
    # Secrets and variables -> Actions -> Variables: PAGES_ENABLED = true. It then runs for
    # pushes to main and for runs started by hand. GitHub Pages cannot send the headers the page's
    # threads need: the page's `coi-serviceworker.js` adds them.
    needs: web
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, the latest one wins.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rc2k-web-${{ github.sha }}
          path: site

      # Only the page's files: the helper script serve.py is for local use.
      - run: rm -f site/serve.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  macos:
    # Built on the Mac runner as on a Mac (`./build.sh mac`): Intel and Apple
    # silicon joined into one program in `Rally Championship.app`, signed ad hoc. Only for
    # `main` and runs started by hand: a private repository's Mac minutes count ten times.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Build
        run: ./build.sh mac

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-macos-${{ github.sha }}
          path: dist/mac/

  android:
    # The Android app (`tools/android/build.sh`): the program as the activity's library, SDL's
    # shared library and the app's Java, packaged with the SDK's own tools (no Gradle), for arm64
    # phones and the x86-64 emulator. The runner's Android SDK, with the platform, build tools and
    # NDK the script names. Signed with the release key when the repository has it (the secrets
    # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS; see the wiki's
    # Android page), else with a debug key made on the runner: an app signed with one key cannot
    # be installed over one signed with another.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RC2K_ANDROID_HOME: ${{ github.workspace }}/../android
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The pinned toolchain (rust-toolchain.toml) with the two Android targets it lists.
      - name: Pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: ". -> target/android"

      - name: Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pil
          mkdir -p "$RC2K_ANDROID_HOME"
          ln -sfn "$ANDROID_SDK_ROOT" "$RC2K_ANDROID_HOME/sdk"
          source tools/android/env.sh
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.1" "ndk;$NDK_VERSION" >/dev/null

      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RC2K_ANDROID_HOME/release.jks"
            echo "RC2K_ANDROID_KEYSTORE=$RC2K_ANDROID_HOME/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the apps are signed with a debug key"
          fi

      # The game's crates fetched first: SDL's source (built for Android by the script) and its
      # Java come from the sdl3-src crate.
      - name: Build
        env:
          RC2K_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RC2K_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cargo fetch
          tools/android/build.sh arm64 x86_64 --final
          rm -f dist/android/*.idsig

      - name: Release key removed
        if: always()
        run: rm -f "$RC2K_ANDROID_HOME/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-android-${{ github.sha }}
          path: dist/android/

  ios:
    # The iPhone / iPad app (`./build.sh ios`), built on the Mac runner with Xcode's iOS SDK: an
    # unsigned `Rally Championship.ipa`, which a player signs when installing it (a sideloading
    # tool with their own Apple ID: tools/ios/README.md). Only for `main` and runs started by hand,
    # as the Mac build (a private repository's Mac minutes count ten times).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The pinned toolchain (rust-toolchain.toml), and the iOS target it does not list.
      - name: Pinned Rust toolchain with the iOS target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
          workspaces: ". -> target/ios"

      - name: Build
        run: ./build.sh ios

      - uses: actions/upload-artifact@v7
        with:
          name: rc2k-ios-${{ github.sha }}
          path: dist/ios/*.ipa

  release:
    needs: [windows-x64, linux-x64, deck, handheld, web, macos, android, ios]
    # The Mac and iOS jobs skipped (other branches) leave the release to the others.
    if: github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the builds: the Pages deploy leaves an artifact of its own in the run.
          pattern: rc2k-*
          path: builds

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          DAY="$(date -u +%Y-%m-%d)"
          cd builds
          # The artifacts lose the executable bit: the Linux and Mac programs get it back (the Mac
          # build runs only for main and runs started by hand, so its program may be missing).
          shopt -s nullglob
          for program in rc2k-linux-x64-*/rc2k rc2k-deck-*/rc2k rc2k-deck-*/rally.sh rc2k-handheld-*/rc2k rc2k-handheld-*/Rally.sh rc2k-macos-*/*.app/Contents/MacOS/rc2k; do
            chmod +x "$program"
          done
          shopt -u nullglob
          for d in */; do
            name="${d%/}"; name="${name%-$GITHUB_SHA}"
            (cd "$d" && zip -q -r "../$name.zip" .)
          done
          if [ "$BRANCH" = main ]; then
            TAG="stable-${DAY//-/}-$SHORT"
            TITLE="Stable $DAY ($SHORT)"
            NOTES="Built from main at $GITHUB_SHA."
            FLAGS=(--latest)
          else
            TAG="experimental-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
            TITLE="Experimental: $BRANCH ($SHORT)"
            NOTES="Experimental build of the $BRANCH branch at $GITHUB_SHA, replaced by its next push. Not checked like the stable builds: expect bugs."
            FLAGS=(--prerelease --latest=false)
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.zip --clobber
          else
            gh release create "$TAG" *.zip --target "$GITHUB_SHA" --title "$TITLE" \
              --notes "$NOTES" "${FLAGS[@]}"
          fi
