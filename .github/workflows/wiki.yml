# Publishes the pages in `wiki/` to the project's GitHub wiki whenever they change on the
# default branch. The wiki must exist (Settings -> Features -> Wikis, and a first page
# made in the Wiki tab). Pages the wiki has and `wiki/` does not are removed: `wiki/` is
# the only source.
name: Publish wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The wiki is pushed with the token the step gets, not the one the checkout keeps.
          persist-credentials: false

      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude '.git' wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git commit -m "Wiki from ${GITHUB_SHA::7}"
          git push
