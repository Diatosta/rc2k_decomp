# The texts of the pages this game adds to the original's: the controller axes page and the
# controller buttons page's new rows. The language file of the original game (files/locale/
# *.TXT) holds none of them.
#
# One file per language, named after the original's language file with ".rc2k.toml" in place
# of its ending (ENGLISH.TXT -> english.rc2k.toml, PORTUGES.TXT -> portuges.rc2k.toml), kept
# in the same folder. UTF-8; the game converts the texts to Windows-1252. A text left out
# is shown in English (this file is built into the game). Keys the game does not know are
# logged and ignored.

